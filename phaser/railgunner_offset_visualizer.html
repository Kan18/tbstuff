<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Railgunner torso offset visualizer</title>
<style>
:root {
  color-scheme: dark;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  letter-spacing: 0;
  --bg: #15181c;
  --panel: rgba(24, 28, 33, 0.94);
  --border: #4d5661;
  --text: #f4f6f8;
  --muted: #aeb6c0;
  --orange: #ff9f43;
  --blue: #00d5ff;
  --yellow: #ffd166;
  --green: #55c98a;
}

* { box-sizing: border-box; }

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
}

button,
input {
  font: inherit;
  letter-spacing: 0;
}

#view { position: fixed; inset: 0; }

#panel {
  position: fixed;
  z-index: 10;
  top: 14px;
  left: 14px;
  width: min(370px, calc(100vw - 28px));
  max-height: calc(100vh - 28px);
  overflow: auto;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
}

h1 { margin: 0 0 3px; font-size: 17px; line-height: 1.25; }
.subtitle { margin: 0 0 14px; color: var(--muted); font-size: 12px; }

fieldset {
  min-width: 0;
  margin: 0 0 13px;
  padding: 0;
  border: 0;
}

legend,
.control-title {
  display: block;
  margin: 0 0 6px;
  color: #d9dee4;
  font-size: 12px;
  font-weight: 650;
}

.segments {
  display: grid;
  grid-auto-columns: 1fr;
  grid-auto-flow: column;
  gap: 4px;
}

.segments input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.segments label,
.view-button {
  min-width: 0;
  height: 32px;
  padding: 6px 10px;
  border: 1px solid #505965;
  border-radius: 4px;
  background: #242a31;
  color: #dce1e7;
  text-align: center;
  cursor: pointer;
  user-select: none;
}

.segments label:hover,
.view-button:hover { border-color: #76818d; background: #2c333b; }

.segments input:focus-visible + label,
.view-button:focus-visible { outline: 2px solid #9fc4ff; outline-offset: 1px; }

.segments input:checked + label,
.view-button.active {
  border-color: #79a9ef;
  background: #244d82;
  color: #fff;
}

#aim-controls.disabled { opacity: 0.43; }

.range-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 76px;
  gap: 10px;
  align-items: center;
}

input[type="range"] { width: 100%; accent-color: var(--green); }

input[type="number"] {
  width: 76px;
  height: 31px;
  padding: 4px 6px;
  border: 1px solid #505965;
  border-radius: 4px;
  background: #171b20;
  color: var(--text);
}

.heading-scale {
  display: flex;
  justify-content: space-between;
  margin-top: 2px;
  color: #8f99a4;
  font-size: 10px;
}

.legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
  margin: 13px 0;
  color: #d5dae0;
  font-size: 12px;
}

.legend-row { display: flex; min-width: 0; align-items: center; gap: 7px; }
.sphere-options {
  display: grid;
  gap: 6px;
  margin: 0 0 13px;
  color: #d5dae0;
  font-size: 12px;
}
.sphere-options label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
.sphere-options input { margin: 0; accent-color: #8fb8ea; }
.sphere-space-control {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}
.sphere-space-control .control-title {
  margin: 0;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
}
.segments.compact {
  display: inline-grid;
  grid-auto-columns: max-content;
  gap: 2px;
}
.segments.compact label {
  height: 22px;
  padding: 2px 7px;
  font-size: 10px;
  line-height: 16px;
}
.dot, .line-swatch { flex: 0 0 auto; display: inline-block; }
.dot {
  width: 10px;
  height: 10px;
  border: 1px solid rgba(255, 255, 255, 0.7);
  border-radius: 50%;
}
.line-swatch { width: 17px; height: 3px; }
.model-swatch {
  width: 13px;
  height: 13px;
  border: 1px solid #a8b5c0;
  background: #263c49;
}
.orange { background: var(--orange); }
.blue { background: var(--blue); }
.yellow { background: var(--yellow); }
.green { background: var(--green); }
.white { background: #f2f5f7; }

#metrics {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 5px 12px;
  padding-top: 10px;
  border-top: 1px solid #3e4650;
  font-size: 12px;
}

#metrics dt { min-width: 0; color: var(--muted); }
#metrics dd {
  margin: 0;
  color: #f5f7f9;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

#views {
  position: fixed;
  z-index: 10;
  top: 14px;
  right: 14px;
  display: grid;
  grid-auto-columns: minmax(54px, auto);
  grid-auto-flow: column;
  gap: 4px;
  padding: 5px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel);
}

.view-button { height: 30px; padding: 4px 10px; font-size: 12px; }

.scene-label {
  padding: 2px 5px;
  border: 1px solid rgba(255, 255, 255, 0.35);
  border-radius: 3px;
  background: rgba(19, 22, 26, 0.86);
  color: #fff;
  font-size: 11px;
  font-weight: 650;
  line-height: 1.25;
  white-space: nowrap;
}

.scene-label.orange-label {
  margin-left: -108px;
  border-color: rgba(255, 159, 67, 0.8);
}
.scene-label.blue-label {
  margin-left: 96px;
  border-color: rgba(0, 213, 255, 0.95);
}
.scene-label.green-label { border-color: rgba(85, 201, 138, 0.9); }
.axis-label { color: #c6cdd5; }

@media (max-width: 700px) {
  #panel {
    top: auto;
    right: 8px;
    bottom: 8px;
    left: 8px;
    width: auto;
    max-height: 49vh;
    padding: 11px;
  }
  #views { top: 8px; right: 8px; }
  .legend { grid-template-columns: 1fr; }
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="view"></div>

<section id="panel" aria-label="Railgunner offset controls">
  <h1>Railgunner torso offset</h1>

  <fieldset>
    <legend>Initial placement rotation</legend>
    <div class="segments">
      <input type="radio" name="rotation" id="rotation-1" value="1" checked>
      <label for="rotation-1">1</label>
      <input type="radio" name="rotation" id="rotation-2" value="2">
      <label for="rotation-2">2</label>
      <input type="radio" name="rotation" id="rotation-3" value="3">
      <label for="rotation-3">3</label>
      <input type="radio" name="rotation" id="rotation-4" value="4">
      <label for="rotation-4">4</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Facing used for level-4 replacement</legend>
    <div class="segments">
      <input type="radio" name="aim-mode" id="mode-unaimed" value="unaimed" checked>
      <label for="mode-unaimed">Initial facing</label>
      <input type="radio" name="aim-mode" id="mode-aimed" value="aimed">
      <label for="mode-aimed">Target-facing</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Rendered rail model</legend>
    <div class="segments">
      <input type="radio" name="model-level" id="model-l1" value="l1" checked>
      <label for="model-l1">L1-3</label>
      <input type="radio" name="model-level" id="model-l4" value="l4">
      <label for="model-l4">L4</label>
    </div>
  </fieldset>

  <div id="aim-controls" class="disabled">
    <label class="control-title" for="aim-heading">Target-facing heading (0 deg = +X, 90 deg = +Z)</label>
    <div class="range-row">
      <input id="aim-heading" type="range" min="-180" max="180" step="1" value="45" disabled>
      <input id="aim-heading-number" type="number" min="-180" max="180" step="1" value="45" disabled aria-label="Aim heading in degrees">
    </div>
    <div class="heading-scale"><span>-180 deg</span><span>0 deg</span><span>180 deg</span></div>
  </div>

  <div class="legend" aria-label="Scene legend">
    <div class="legend-row"><span class="model-swatch"></span>Selected Railgunner model</div>
    <div class="legend-row"><span class="dot orange"></span>L1-3 Torso center</div>
    <div class="legend-row"><span class="dot blue"></span>L4 Torso center</div>
    <div class="legend-row"><span class="line-swatch yellow"></span>L3-to-L4 movement</div>
    <div class="legend-row"><span class="line-swatch green"></span>L4 facing</div>
    <div class="legend-row"><span class="line-swatch white"></span>Original placement axis</div>
  </div>

  <fieldset>
    <legend>No-placement spheres (radius 2.96)</legend>
    <div class="sphere-options">
      <label><input id="l1-sphere" type="checkbox"> <span class="dot orange"></span>L1-3 Torso sphere</label>
      <label><input id="l4-sphere" type="checkbox"> <span class="dot blue"></span>L4 Torso sphere</label>
    </div>
    <div class="sphere-space-control">
      <span class="control-title">Sphere coordinates</span>
      <div class="segments compact" role="group" aria-label="Positions represented by spheres">
        <input type="radio" name="sphere-space" id="sphere-click" value="click" checked>
        <label for="sphere-click">Mouse clicks</label>
        <input type="radio" name="sphere-space" id="sphere-submitted" value="submitted">
        <label for="sphere-submitted">Submitted</label>
      </div>
    </div>
  </fieldset>

  <dl id="metrics"></dl>
</section>

<nav id="views" aria-label="Camera view">
  <button type="button" class="view-button active" data-view="3d">3D</button>
  <button type="button" class="view-button" data-view="top">Top</button>
  <button type="button" class="view-button" data-view="side">Side</button>
</nav>

function decodeRobloxMesh(base64, label) {
  const encoded = base64.replace(/\s/g, "");
  const bytes = Uint8Array.from(atob(encoded), (character) => character.charCodeAt(0));
  const signature = String.fromCharCode(...bytes.subarray(0, 13));
  if (signature !== "version 2.00\n") throw new Error(`unexpected ${label} mesh version`);

  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const headerOffset = 13;
  const headerSize = view.getUint16(headerOffset, true);
  const vertexSize = view.getUint8(headerOffset + 2);
  const faceSize = view.getUint8(headerOffset + 3);
  const vertexCount = view.getUint32(headerOffset + 4, true);
  const faceCount = view.getUint32(headerOffset + 8, true);
  if (headerSize !== 12 || vertexSize < 24 || faceSize < 12) {
    throw new Error(`unsupported ${label} mesh layout`);
  }

  const vertexOffset = headerOffset + headerSize;
  const faceOffset = vertexOffset + vertexCount * vertexSize;
  const positions = new Float32Array(vertexCount * 3);
  const normals = new Float32Array(vertexCount * 3);
  for (let index = 0; index < vertexCount; index += 1) {
    const source = vertexOffset + index * vertexSize;
    for (let axis = 0; axis < 3; axis += 1) {
      positions[index * 3 + axis] = view.getFloat32(source + axis * 4, true);
      normals[index * 3 + axis] = view.getFloat32(source + 12 + axis * 4, true);
    }
  }

  const indices = new Uint32Array(faceCount * 3);
  for (let face = 0; face < faceCount; face += 1) {
    const source = faceOffset + face * faceSize;
    indices[face * 3] = view.getUint32(source, true);
    indices[face * 3 + 1] = view.getUint32(source + 4, true);
    indices[face * 3 + 2] = view.getUint32(source + 8, true);
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("normal", new THREE.BufferAttribute(normals, 3));
  geometry.setIndex(new THREE.BufferAttribute(indices, 1));
  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();
  return geometry;
}

const sharedBodyGeometry = decodeRobloxMesh(BODY_MESH_BASE64, "body");
const headGeometry = decodeRobloxMesh(HEAD_MESH_BASE64, "head");
// The Head part is a uniformly 0.4-scaled classic head. Its built-in mesh then
// applies the captured SpecialMesh.Scale of 1.25 without inheriting 2:1:1 box
// proportions from the Head part.
headGeometry.scale(0.4 * 1.25, 0.4 * 1.25, 0.4 * 1.25);

const boxGeometry = new THREE.BoxGeometry(1, 1, 1);
const cylinderGeometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 40);
// Roblox cylinders run along local X; Three.js cylinders run along local Y.
cylinderGeometry.rotateZ(-Math.PI / 2);

function createModelMeshes(group, parts) {
  return parts.map((part) => {
    const material = new THREE.MeshStandardMaterial({
      color: part.color,
      roughness: 0.78,
      metalness: 0,
      transparent: true,
      opacity: 0.62,
      depthWrite: false,
    });
    let geometry = headGeometry;
    if (part.kind === "mesh") geometry = sharedBodyGeometry;
    if (part.kind === "box") geometry = boxGeometry;
    if (part.kind === "cylinder") geometry = cylinderGeometry;
    const mesh = new THREE.Mesh(geometry, material);
    if (part.kind === "mesh") {
      // The cached mesh has InitialSize (2, 2, 1); MeshPart.Size supplies this scale.
      mesh.scale.set(part.size[0] / 2, part.size[1] / 2, part.size[2]);
    } else if (part.kind === "box" || part.kind === "cylinder") {
      mesh.scale.fromArray(part.size);
    }
    const depthMesh = new THREE.Mesh(
      geometry,
      new THREE.MeshBasicMaterial({
        colorWrite: false,
        depthWrite: true,
        depthTest: true,
      }),
    );
    depthMesh.renderOrder = 1;
    mesh.add(depthMesh);
    mesh.renderOrder = 2;
    mesh.userData.part = part;
    mesh.userData.baseRotation = new THREE.Matrix4().set(
      part.rotation[0][0], part.rotation[0][1], part.rotation[0][2], 0,
      part.rotation[1][0], part.rotation[1][1], part.rotation[1][2], 0,
      part.rotation[2][0], part.rotation[2][1], part.rotation[2][2], 0,
      0, 0, 0, 1,
    );
    group.add(mesh);
    return mesh;
  });
}

const l1ModelGroup = new THREE.Group();

scene.add(l1ModelGroup, l4ModelGroup);
const l1ModelMeshes = createModelMeshes(l1ModelGroup, L1_BODY_PARTS);

function radians(value) { return value * Math.PI / 180; }

function normalizedDegrees(value) {
  let result = Number(value);
  while (result > 180) result -= 360;
  while (result <= -180) result += 360;
  return result;
}

function rotateQuarterTurns(vector, rotation) {
  const angle = radians((rotation - 1) * 90);
  const cosine = Math.cos(angle);
  const sine = Math.sin(angle);
  return new THREE.Vector3(
    vector.x * cosine + vector.z * sine,
    vector.y,
    -vector.x * sine + vector.z * cosine,
  );
}

function replacementDisplacement(headingDegrees) {
  const heading = radians(headingDegrees);
  const forward = new THREE.Vector3(Math.cos(heading), 0, Math.sin(heading));
  const right = new THREE.Vector3(-Math.sin(heading), 0, Math.cos(heading));
  return right.multiplyScalar(L4_REPLACEMENT_RIGHT)
    .add(forward.multiplyScalar(L4_REPLACEMENT_FORWARD))
    .add(new THREE.Vector3(0, L4_REPLACEMENT_Y, 0));
}

function updateL1ModelPose(rotation, heading, torsoCenter) {
  const defaultHeading = DEFAULT_HEADINGS[rotation - 1];
  const quarterTurn = new THREE.Matrix4().makeRotationY(radians((rotation - 1) * 90));
  const aimTurn = new THREE.Matrix4().makeRotationY(radians(defaultHeading - heading));
  const modelRotation = aimTurn.clone().multiply(quarterTurn);
  for (const mesh of l1ModelMeshes) {
    const initialPosition = new THREE.Vector3()
      .fromArray(mesh.userData.part.position)
      .applyMatrix4(quarterTurn);
    mesh.position.copy(initialPosition)
      .sub(torsoCenter)
      .applyMatrix4(aimTurn)
      .add(torsoCenter);
    const rotatedPart = modelRotation.clone().multiply(mesh.userData.baseRotation);
    mesh.quaternion.setFromRotationMatrix(rotatedPart);
  }
}

function updateL4ModelPose(heading, torsoCenter) {
  const modelRotation = new THREE.Matrix4().makeRotationY(radians(-heading - 90));
  for (const mesh of l4ModelMeshes) {
    mesh.position.fromArray(mesh.userData.part.position)
      .applyMatrix4(modelRotation)
      .add(torsoCenter);
    const rotatedPart = modelRotation.clone().multiply(mesh.userData.baseRotation);
    mesh.quaternion.setFromRotationMatrix(rotatedPart);
  }
}

function signed(value) {
  const rounded = Math.abs(value) < 0.0005 ? 0 : value;
  return `${rounded >= 0 ? "+" : ""}${rounded.toFixed(3)}`;
}

function headingText(value) { return `${normalizedDegrees(value).toFixed(1)} deg`; }

function updateMetrics(l1, l4, heading, displacement) {
  document.getElementById("metrics").innerHTML = `
    <dt>Initial facing</dt><dd>${headingText(DEFAULT_HEADINGS[state.rotation - 1])}</dd>
    <dt>Facing used by L4</dt><dd>${headingText(heading)}</dd>
    <dt>L1-3 center X/Z</dt><dd>${signed(l1.x)}, ${signed(l1.z)}</dd>
    <dt>L4 center X/Z</dt><dd>${signed(l4.x)}, ${signed(l4.z)}</dd>
    <dt>L1-3 horizontal offset</dt><dd>${Math.hypot(l1.x, l1.z).toFixed(4)} stud</dd>
    <dt>L4 horizontal offset</dt><dd>${Math.hypot(l4.x, l4.z).toFixed(4)} stud</dd>
    <dt>L3-to-L4 horizontal move</dt><dd>${Math.hypot(displacement.x, displacement.z).toFixed(4)} stud</dd>
    <dt>L3-to-L4 vertical move</dt><dd>+${displacement.y.toFixed(4)} stud</dd>
  `;
}

function updateScene() {
  const defaultHeading = DEFAULT_HEADINGS[state.rotation - 1];
  const upgradeHeading = state.aimed ? state.aimHeading : defaultHeading;
  const l1 = rotateQuarterTurns(L1_ROTATION_ONE, state.rotation);
  const displacement = replacementDisplacement(upgradeHeading);
  const l4 = l1.clone().add(displacement);

  l1Point.position.copy(l1);
  l4Point.position.copy(l4);
  const sphereYOffset = state.sphereSpace === "click" ? 0.4 : 0;
  l1ExclusionSphere.position.copy(l1).y += sphereYOffset;
  l4ExclusionSphere.position.copy(l4).y += sphereYOffset;
  l1ModelGroup.visible = state.modelLevel === "l1";
  l4ModelGroup.visible = state.modelLevel === "l4";
  updateL1ModelPose(state.rotation, upgradeHeading, l1);
  updateL4ModelPose(upgradeHeading, l4);
  updateLine(l1OffsetLine, [new THREE.Vector3(0, l1.y, 0), l1]);
  updateLine(l4OffsetLine, [new THREE.Vector3(0, l4.y, 0), l4]);

  replacementArrow.position.copy(l1);
  replacementArrow.setDirection(displacement.clone().normalize());
  replacementArrow.setLength(displacement.length(), 0.055, 0.035);

  const facingDirection = new THREE.Vector3(
    Math.cos(radians(upgradeHeading)),
    0,
    Math.sin(radians(upgradeHeading)),
  );
  facingArrow.position.copy(l1).add(new THREE.Vector3(0, 0.18, 0));
  facingArrow.setDirection(facingDirection);
  facingLabel.position.copy(facingArrow.position)
    .add(facingDirection.clone().multiplyScalar(1.1))
    .add(new THREE.Vector3(0, 0.04, 0));

  updateMetrics(l1, l4, upgradeHeading, displacement);
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.72, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 1.2;
controls.maxDistance = 12;

function setView(name) {
  camera.up.set(0, 1, 0);
  if (name === "top") {
    camera.up.set(0, 0, -1);
    camera.position.set(0.001, 4.2, 0.001);
  } else if (name === "side") {
    camera.position.set(3.7, 1.25, 0);
  } else {
    camera.position.set(2.9, 2.25, 3.25);
  }
  controls.target.set(0, 0.72, 0);
  controls.update();
  document.querySelectorAll(".view-button").forEach((button) => {
    button.classList.toggle("active", button.dataset.view === name);
  });
}

document.querySelectorAll('input[name="rotation"]').forEach((input) => {
  input.addEventListener("change", () => {
    state.rotation = Number(input.value);
    updateScene();
  });
});

document.querySelectorAll('input[name="aim-mode"]').forEach((input) => {
  input.addEventListener("change", () => {
    state.aimed = input.value === "aimed";
    document.getElementById("aim-controls").classList.toggle("disabled", !state.aimed);
    document.getElementById("aim-heading").disabled = !state.aimed;
    document.getElementById("aim-heading-number").disabled = !state.aimed;
    updateScene();
  });
});

document.querySelectorAll('input[name="model-level"]').forEach((input) => {
  input.addEventListener("change", () => {
    state.modelLevel = input.value;
    updateScene();
  });
});

const headingRange = document.getElementById("aim-heading");
const headingNumber = document.getElementById("aim-heading-number");

function setAimHeading(value) {
  state.aimHeading = normalizedDegrees(value);
  headingRange.value = String(state.aimHeading);
  headingNumber.value = String(state.aimHeading);
  updateScene();
}

headingRange.addEventListener("input", () => setAimHeading(headingRange.value));
headingNumber.addEventListener("input", () => {
  if (headingNumber.value !== "") setAimHeading(headingNumber.value);
});
document.querySelectorAll(".view-button").forEach((button) => {
  button.addEventListener("click", () => setView(button.dataset.view));
});
document.getElementById("l1-sphere").addEventListener("change", (event) => {
  l1ExclusionSphere.visible = event.target.checked;
});
document.getElementById("l4-sphere").addEventListener("change", (event) => {
  l4ExclusionSphere.visible = event.target.checked;
});
document.querySelectorAll('input[name="sphere-space"]').forEach((input) => {
  input.addEventListener("change", () => {
    state.sphereSpace = input.value;
    updateScene();
  });
});

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

setView("3d");
updateScene();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
